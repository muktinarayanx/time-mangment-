<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Management</title>
    <!-- Use Inter font for a modern, clean look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Study Management</h1>
            <p class="subtitle">Track your daily study progress effortlessly.</p>
        </header>

        <!-- Add Record Modal -->
        <dialog id="add-modal" class="card modal">
            <div class="modal-header">
                <h2>Add Study Record</h2>
                <button type="button" id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <form id="add-form">
                <div class="input-group">
                    <label for="subject-input">Subject</label>
                    <input type="text" id="subject-input" placeholder="e.g. Mathematics, History..." required>
                </div>
                <div class="entries-container" id="entries-container">
                    <div class="entry-row">
                        <div class="input-group">
                            <label>Date</label>
                            <input type="date" class="date-input" required>
                        </div>
                        <div class="input-group">
                            <label>Status</label>
                            <select class="status-input">
                                <option value="Undone" selected>Undone</option>
                                <option value="Done">Done</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label class="hidden-label">&nbsp;</label>
                            <button type="button" class="secondary-btn remove-btn" disabled>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <button type="button" id="add-date-btn" class="secondary-btn">+ Add another date</button>
                <button type="submit" class="primary-btn" style="margin-top: 0.5rem;">Save Records</button>
            </form>
        </dialog>

        <!-- Records Table Section -->
        <section class="card">
            <div class="controls">
                <button id="open-modal-btn" class="primary-btn small-btn">+ Add Record</button>
                <div class="filter-group">
                    <label for="filter-select">Filter:</label>
                    <select id="filter-select">
                        <option value="All">All</option>
                        <option value="Done">Done</option>
                        <option value="Undone">Undone</option>
                    </select>
                </div>
                <button id="sort-btn" class="secondary-btn">Sort by Date &uarr;</button>
            </div>
            
            <div class="table-wrapper">
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Subject</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <!-- tbodys will be populated via JS -->
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
